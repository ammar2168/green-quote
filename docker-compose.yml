# Project name is pinned so the volume/network keep stable names no matter
# which directory (or git worktree) compose is run from.
name: green-quote

services:
  postgres:
    image: postgres:18-alpine
    container_name: green-quote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-green_quote}
      # Require a real password instead of trusting anything that connects.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      # Host port is configurable so it can dodge a Postgres already on 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ wants the whole directory, not .../data — it keeps its
      # cluster in a major-version subdirectory so pg_upgrade can work.
      - postgres-data:/var/lib/postgresql
      # Any .sql/.sh dropped in here runs once, on first init of an empty volume.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-green_quote}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The app and its migration job sit behind the `app` profile, so a plain
  # `docker compose up -d` still starts only Postgres for `pnpm dev`. Run the
  # whole stack with `docker compose --profile app up -d --build`.

  # One-shot: applies db/migrations, then exits. `app` waits for it to succeed.
  migrate:
    profiles: [app]
    build:
      context: .
      target: tools
    image: green-quote-tools
    environment:
      # Inside the compose network Postgres is `postgres:5432`, not the
      # localhost URL in .env that `pnpm dev` uses.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-green_quote}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    profiles: [app]
    build:
      context: .
      target: runner
    image: green-quote-app
    container_name: green-quote-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-green_quote}
      # Read from .env. The app refuses to start without it.
      SESSION_SECRET: ${SESSION_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
